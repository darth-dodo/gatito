<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windowsill demo</title>
    <style>
      :root {
        --menu-h: 28px;
        --dock-h: 64px;
        --dock-gap: 8px;
        --ink: #2b2d42;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        color: var(--ink);
      }
      body {
        background: linear-gradient(160deg, #a8c0e8 0%, #c9b8e2 45%, #f2c7b5 100%);
        background-size: 140% 140%;
        animation: drift 40s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from { background-position: 0% 0%; }
        to { background-position: 100% 100%; }
      }
      .menubar {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--menu-h);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 16px;
        background: rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(18px);
        font-weight: 600;
      }
      .menubar span + span { font-weight: 400; opacity: 0.75; }
      .menubar .clock { margin-left: auto; font-weight: 400; }
      .window {
        position: fixed;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 18px 40px rgba(43, 45, 66, 0.22);
        overflow: hidden;
      }
      .window .title {
        height: 28px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        background: rgba(236, 236, 242, 0.95);
        border-bottom: 1px solid rgba(43, 45, 66, 0.08);
      }
      .window .title i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }
      .window .title i:nth-child(1) { background: #ff5f57; }
      .window .title i:nth-child(2) { background: #febc2e; }
      .window .title i:nth-child(3) { background: #28c840; }
      .window .title b { margin-left: 8px; font-weight: 500; opacity: 0.7; }
      .window .line {
        height: 9px;
        margin: 12px 16px 0;
        border-radius: 5px;
        background: rgba(43, 45, 66, 0.1);
      }
      .editor { left: 7%; top: 12%; width: 44%; height: 46%; }
      .notes { right: 8%; top: 20%; width: 28%; height: 34%; }
      .dock {
        position: fixed;
        left: 50%;
        bottom: var(--dock-gap);
        height: var(--dock-h);
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .dock i {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: block;
      }
      .dock i:nth-child(1) { background: linear-gradient(135deg, #5ac8fa, #007aff); }
      .dock i:nth-child(2) { background: linear-gradient(135deg, #ffd479, #ff9500); }
      .dock i:nth-child(3) { background: linear-gradient(135deg, #a3e4a0, #34c759); }
      .dock i:nth-child(4) { background: linear-gradient(135deg, #d6b8ff, #af52de); }
      .dock i:nth-child(5) { background: linear-gradient(135deg, #ffb3c1, #ff375f); }
      .dock i:nth-child(6) { background: linear-gradient(135deg, #e5e5ea, #8e8e93); }
      #pets {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #pets canvas { display: block; }
      @media (prefers-reduced-motion: reduce) {
        body { animation: none; }
      }
    </style>
    <script type="module" src="/src/demo/main.ts"></script>
  </head>
  <body>
    <div class="menubar" aria-hidden="true">
      <span>Windowsill demo</span><span>File</span><span>Edit</span><span>View</span>
      <span class="clock">Sat 9:41</span>
    </div>
    <div class="window editor" aria-hidden="true">
      <div class="title"><i></i><i></i><i></i><b>main.ts</b></div>
      <div class="line" style="width: 62%"></div>
      <div class="line" style="width: 48%"></div>
      <div class="line" style="width: 75%"></div>
      <div class="line" style="width: 33%"></div>
      <div class="line" style="width: 58%"></div>
      <div class="line" style="width: 40%"></div>
    </div>
    <div class="window notes" aria-hidden="true">
      <div class="title"><i></i><i></i><i></i><b>Notes</b></div>
      <div class="line" style="width: 70%"></div>
      <div class="line" style="width: 52%"></div>
      <div class="line" style="width: 64%"></div>
    </div>
    <div class="dock" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <main id="pets" aria-label="Four pixel cats living on a pretend desktop"></main>
  </body>
</html>
